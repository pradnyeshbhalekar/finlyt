[project]
name = "finlyt-api"
version = "0.1.0"
description = "Backend API for Finlyt, a personal expense tracker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "google-auth[requests]>=2.62.1",
    "google-genai>=2.34.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "tzdata>=2026.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
